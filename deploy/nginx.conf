# Replace watch.example.com and configure TLS certificates before using.
# The TLS server block should include these locations.
server {
    listen 80;
    server_name watch.example.com;
    # For a real deployment redirect HTTP to your HTTPS server block.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        client_max_body_size 16k;
    }
}
